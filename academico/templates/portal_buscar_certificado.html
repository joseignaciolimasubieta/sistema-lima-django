{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificados - Escuela Financiera Luca Pacioli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glow-bg { position: absolute; width: 100vw; height: 100vh; overflow: hidden; top: 0; left: 0; z-index: -1; background-color: #f8fafc; }
        .glow-1 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(30, 58, 138, 0.15) 0%, rgba(255,255,255,0) 70%); top: -150px; left: 50%; transform: translateX(-80%); border-radius: 50%; animation: float 8s infinite alternate ease-in-out; }
        .glow-2 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, rgba(255,255,255,0) 70%); top: 100px; left: 50%; transform: translateX(10%); border-radius: 50%; animation: float 10s infinite alternate-reverse ease-in-out; }
        @keyframes float { 0% { transform: translate(-50%, 0) scale(1); } 100% { transform: translate(-45%, 30px) scale(1.05); } }
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center py-12 px-4 relative overflow-x-hidden">

    <div class="glow-bg">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
    </div>

    <div class="w-full max-w-xl relative z-10 animate-slide-up">
        
        <div class="flex justify-center mb-8 relative">
            <div class="absolute inset-0 bg-[#d4af37]/20 blur-3xl rounded-full w-40 h-40 mx-auto"></div>
            <img src="{% static 'luca_pacioli.jpg' %}" alt="Escuela Financiera Luca Pacioli" class="w-40 md:w-48 h-auto object-cover rounded-3xl shadow-[0_15px_35px_rgba(0,0,0,0.2)] relative z-10 border border-white/20 transition-transform duration-500 hover:scale-105">
        </div>

        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-black text-slate-900 tracking-tight mb-2">Certificados de Participación</h1>
            <p class="text-[#d4af37] font-bold tracking-[0.25em] text-xs uppercase">Portal Oficial Académico</p>
        </div>

        <div class="bg-white/90 backdrop-blur-xl p-8 md:p-10 rounded-[2.5rem] shadow-[0_20px_50px_rgb(0,0,0,0.05)] border border-white">
            <form method="POST" class="flex flex-col gap-6">
                {% csrf_token %}
                <div class="space-y-3">
                    <label class="block text-[11px] font-black text-slate-500 uppercase tracking-widest text-center">Ingrese su Cédula de Identidad:</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-6 pointer-events-none text-slate-400 group-focus-within:text-[#1e3a8a] transition-colors">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path></svg>
                        </div>
                        <input type="text" name="ci" required placeholder="Ej: 1234567" class="w-full h-16 pl-14 pr-6 rounded-2xl bg-slate-50 border-2 border-slate-100 focus:bg-white focus:border-[#d4af37] focus:ring-4 focus:ring-[#d4af37]/10 outline-none transition-all font-black text-slate-800 text-xl text-center shadow-inner">
                    </div>
                </div>
                
                <button type="submit" class="w-full h-16 bg-[#0f172a] hover:bg-[#1e3a8a] text-white text-[13px] font-black rounded-2xl uppercase tracking-widest transition-all shadow-[0_10px_25px_rgba(15,23,42,0.3)] hover:shadow-[0_15px_35px_rgba(30,58,138,0.4)] active:scale-[0.98] flex items-center justify-center gap-3 relative overflow-hidden group">
                    <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
                    <span class="relative z-10 text-[#d4af37]">Consultar Registros</span>
                    <svg class="w-5 h-5 relative z-10 text-[#d4af37]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
